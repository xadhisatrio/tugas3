<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugas Universitas Terbuka</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0056b3, #0099ff);
        }

        .card {
            background: #fff;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            width: 350px;
        }

        .logo {
            width: 120px;
            margin-bottom: 20px;
        }

        h1 {
            color: #0056b3;
            margin-bottom: 20px;
            font-size: 24px;
        }

        p {
            font-size: 18px;
            color: #333;
            margin: 10px 0;
        }

        .nim {
            font-weight: bold;
            color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="card">
        <img src="https://i.imgur.com/GAvDXua.png" alt="Logo Universitas Terbuka" class="logo">

        <h1>Universitas Terbuka</h1>

        <p><strong>Nama:</strong> Adhi Satrio</p>
        <p class="nim"><strong>NIM:</strong> 051077965</p>
    </div>

</body>
</html>
